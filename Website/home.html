<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyara - Welcome to Zyara</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="home-styles.css">

    <!-- Dropdown CSS -->
    <link rel="stylesheet" href="css/dropdown-styles.css">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- JS -->
    <script src="js/dropdown.js" defer></script>
</head>
<body>

    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="navbar">
        <div class="nav-container">

            <!-- Logo -->
            <div class="nav-brand">
                <i class="fas fa-crown"></i>
                <span>Zyara</span>
            </div>

            <!-- Menu -->
            <ul class="nav-menu">
                <li>
                    <a href="home.html" class="nav-link active">
                        Home
                    </a>
                </li>

                <li>
                    <a href="booking.html" class="nav-link">
                        Rooms & Booking
                    </a>
                </li>

                <li>
                    <a href="contact.html" class="nav-link">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="about.html" class="nav-link">
                        About
                    </a>
                </li>

                <!-- Dropdown -->
                <li class="dropdown">
                    <a href="#" class="nav-link dropdown-toggle">
                        <i class="fas fa-user-circle"></i>
                        <span>Admin</span>
                        <i class="fas fa-caret-down"></i>
                    </a>

                    <div class="dropdown-menu">

                        <a href="#" class="dropdown-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <i class="fas fa-user"></i>
                                <span>User</span>
                            </div>

                            <span class="role-indicator role-user">
                                Current
                            </span>
                        </a>

                        <div class="dropdown-divider"></div>

                        <a href="#" class="dropdown-item">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <i class="fas fa-user-shield"></i>
                                <span>Admin</span>
                            </div>
                        </a>

                    </div>
                </li>
            </ul>

            <!-- Mobile Menu -->
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    </nav>

    <!-- =========================
         HERO SECTION
    ========================== -->

    <section id="home" class="hero">

        <div class="hero-content">
            <h1 class="hero-title">
                Welcome to Zyara Hotel
            </h1>

            <p class="hero-subtitle">
                Experience luxury, comfort, and unforgettable moments
                at our world-class hotel
            </p>

            <div class="hero-buttons">

                <button class="btn-primary"
                    onclick="window.location.href='booking.html'">

                    <i class="fas fa-bed"></i>
                    Book Now
                </button>

                <button class="btn-secondary"
                    onclick="scrollToSection('about')">

                    <i class="fas fa-info-circle"></i>
                    Learn More
                </button>

            </div>
        </div>

        <div class="hero-image">
            <img
                src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800&h=600&fit=crop"
                alt="Luxury Hotel">
        </div>

    </section>

</body>
</html>
