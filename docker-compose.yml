services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_PASSWORD: Ragavi_31
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Ragavi_31
      MYSQL_DATABASE: hotel_management
      MYSQL_USER: user
      MYSQL_PASSWORD: user123

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"